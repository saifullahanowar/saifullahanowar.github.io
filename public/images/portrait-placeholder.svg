<!--
  Single Portrait Placeholder for Saifullah Anowar
  To swap in a real headshot later:
  1. Place an optimized 320x384 (or 640x768 2x) WebP headshot at public/images/portrait.webp
  2. Update `profile.portrait.src` in src/data/profile.ts to '/images/portrait.webp'
  3. Delete this placeholder file so only one image remains in the project.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 384" width="320" height="384" role="img" aria-labelledby="portraitTitle portraitDesc">
  <title id="portraitTitle">Saifullah Anowar Portrait Placeholder</title>
  <desc id="portraitDesc">Clean light editorial monogram and silhouette placeholder for Saifullah Anowar</desc>
  <defs>
    <linearGradient id="lightCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F7FB" />
      <stop offset="100%" stop-color="#E8EEF6" />
    </linearGradient>
    <linearGradient id="navyBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4278" />
      <stop offset="100%" stop-color="#112C52" />
    </linearGradient>
  </defs>

  <!-- Soft editorial light backdrop -->
  <rect width="320" height="384" fill="url(#lightCanvas)" />

  <!-- Subtle architectural hairline grid -->
  <g stroke="#163A6B" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="96" x2="320" y2="96" />
    <line x1="0" y1="192" x2="320" y2="192" />
    <line x1="0" y1="288" x2="320" y2="288" />
    <line x1="80" y1="0" x2="80" y2="384" />
    <line x1="160" y1="0" x2="160" y2="384" />
    <line x1="240" y1="0" x2="240" y2="384" />
  </g>

  <!-- Subtle inset frame -->
  <rect x="16" y="16" width="288" height="352" rx="12" fill="none" stroke="#163A6B" stroke-opacity="0.14" stroke-width="1" />

  <!-- Minimal silhouette -->
  <g fill="#163A6B" fill-opacity="0.08">
    <circle cx="160" cy="136" r="44" />
    <path d="M76 314 C80 246 116 216 160 216 C204 216 240 246 244 314 Z" />
  </g>

  <!-- Monogram crest -->
  <circle cx="160" cy="168" r="52" fill="url(#navyBadge)" />
  <circle cx="160" cy="168" r="46" fill="none" stroke="#D2B17A" stroke-opacity="0.55" stroke-width="1.2" />
  <text x="160" y="182" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="600" letter-spacing="2.5" fill="#FFFFFF">SA</text>

  <!-- Caption -->
  <line x1="118" y1="256" x2="202" y2="256" stroke="#9A6B2F" stroke-opacity="0.65" stroke-width="1.5" />
  <text x="160" y="284" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="2.6" fill="#0F172A">SAIFULLAH ANOWAR</text>
  <text x="160" y="304" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="1.8" fill="#475569">ACCOUNTING &amp; ERP</text>
</svg>
