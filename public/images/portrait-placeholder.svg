<!--
  Single Portrait Placeholder for Saifullah Anowar
  To swap in a real headshot later:
  1. Replace this file or place an optimized 320x384 (or 640x768 2x) WebP portrait at:
     public/images/portrait.webp
  2. Update `profile.portrait.src` in src/data/profile.ts to '/images/portrait.webp'
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 384" width="320" height="384" role="img" aria-labelledby="portraitTitle portraitDesc">
  <title id="portraitTitle">Saifullah Anowar Portrait Placeholder</title>
  <desc id="portraitDesc">Minimal editorial monogram and silhouette placeholder for Saifullah Anowar</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152B4D" />
      <stop offset="100%" stop-color="#0F1C33" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8A25F" />
      <stop offset="100%" stop-color="#E2C488" />
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="320" height="384" fill="url(#bg)" />

  <!-- Subtle architectural grid lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="96" x2="320" y2="96" />
    <line x1="0" y1="192" x2="320" y2="192" />
    <line x1="0" y1="288" x2="320" y2="288" />
    <line x1="80" y1="0" x2="80" y2="384" />
    <line x1="160" y1="0" x2="160" y2="384" />
    <line x1="240" y1="0" x2="240" y2="384" />
  </g>

  <!-- Inner editorial frame -->
  <rect x="16" y="16" width="288" height="352" fill="none" stroke="#C8A25F" stroke-opacity="0.35" stroke-width="1" />

  <!-- Subtle portrait silhouette -->
  <g fill="#FFFFFF" fill-opacity="0.1">
    <circle cx="160" cy="142" r="46" />
    <path d="M74 316 C78 248 114 218 160 218 C206 218 242 248 246 316 Z" />
  </g>

  <!-- Monogram crest -->
  <circle cx="160" cy="176" r="56" fill="#0F1C33" fill-opacity="0.82" stroke="url(#accent)" stroke-width="1.5" />
  <text x="160" y="191" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" letter-spacing="3" fill="#F8FAFC">SA</text>

  <!-- Caption bar -->
  <line x1="112" y1="264" x2="208" y2="264" stroke="url(#accent)" stroke-width="1.5" />
  <text x="160" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="2.8" fill="#E2E8F0">SAIFULLAH ANOWAR</text>
  <text x="160" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" letter-spacing="1.8" fill="#94A3B8">ACCOUNTING &amp; ERP</text>
</svg>
